name: Anaconda Python Multi-Version Matrix Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  matrix-testing:
    name: Conda Test Matrix (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Don't stop testing other environments if one fails
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11"]

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Spin Up Miniconda Environment Layer
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          activate-environment: test-env
          channels: conda-forge,defaults

      - name: Output Environment System Verification
        shell: bash -l {0}
        run: |
          conda info
          python --version

      - name: Install Dependencies inside Conda Core
        shell: bash -l {0}
        run: |
          # Install production packages using conda mapping
          conda install --yes streamlit deep-translator gtts
          pip install anyascii # Fallback to pip for custom modules not native to conda distributions
          
          # Optional: install testing suite if you write pytest test cases
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Automated Environment Validation Checks
        shell: bash -l {0}
        run: |
          # Test executing python calls across your underlying scripts 
          python -m compileall .
